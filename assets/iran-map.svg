    <circle cx="455" cy="245" r="3.5" class="city-dot major"/>
    <text x="461" y="249" class="city-label">تهران</text>

    <!-- مشهد -->
    <circle cx="720" cy="430" r="5" class="city-dot major"/>
    <circle cx="720" cy="430" r="9" fill="none" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1"/>
    <circle cx="720" cy="430" r="13" fill="none" stroke="rgba(251, 191, 36, 0.2)" stroke-width="0.5"/>
    <text x="730" y="433" class="city-label" style="font-size: 11.5px; font-weight: 700;">مشهد</text>

    <!-- بجنورد -->
    <circle cx="715" cy="310" r="3" fill="#fde68a"/>
    <text x="723" y="313" class="city-label" style="fill: #fde68a; font-size: 9px;">بجنورد</text>

    <!-- بیرجند -->
    <circle cx="725" cy="545" r="3" fill="#fde68a"/>
    <text x="733" y="548" class="city-label" style="fill: #fde68a; font-size: 9px;">بیرجند</text>

    <!-- اصفهان -->
    <circle cx="485" cy="460" r="3" class="city-dot"/>
