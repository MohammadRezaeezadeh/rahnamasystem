      <ellipse cx="-75" cy="-160" rx="48" ry="40" class="leaf"/>
      <ellipse cx="-100" cy="-135" rx="40" ry="34" class="leaf"/>
      <ellipse cx="-120" cy="-115" rx="34" ry="30" class="leaf"/>
      <ellipse cx="-138" cy="-105" rx="28" ry="24" class="leaf"/>
      <ellipse cx="-65" cy="-180" rx="34" ry="28" class="leaf"/>

      <ellipse cx="75" cy="-165" rx="48" ry="40" class="leaf"/>
      <ellipse cx="100" cy="-140" rx="40" ry="34" class="leaf"/>
      <ellipse cx="120" cy="-120" rx="34" ry="30" class="leaf"/>
      <ellipse cx="138" cy="-110" rx="28" ry="24" class="leaf"/>
      <ellipse cx="65" cy="-185" rx="34" ry="28" class="leaf"/>

