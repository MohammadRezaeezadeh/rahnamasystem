    <!-- بندرعباس -->
    <circle cx="700" cy="715" r="2.5" class="city-dot"/>
    <text x="706" y="718" class="city-label gray">بندرعباس</text>
  </g>

  <!-- ================ درخت سپیدار (رشد کرده از مشهد) ================ -->
  <g class="sepidar-tree" transform="translate(720, 430)">
    <!-- سایه زمین -->
    <ellipse cx="0" cy="6" rx="140" ry="18" fill="rgba(0,0,0,0.5)" opacity="0.4"/>

    <!-- تنه اصلی -->
    <path d="
      M -12 5
      C -10 -30, -8 -70, -5 -110
      C -3 -145, -1 -175, 0 -200
      C 1 -175, 3 -145, 5 -110
      C 8 -70, 10 -30, 12 5
      C 8 8, -8 8, -12 5 Z
    " class="tree-trunk"/>

    <!-- ریشه‌های کوچک -->
    <path d="M -12 5 C -22 10, -32 12, -38 11" stroke="#2d1810" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 12 5 C 22 10, 32 12, 38 11" stroke="#2d1810" stroke-width="2" fill="none" stroke-linecap="round"/>
