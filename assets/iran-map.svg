      <path d="M 95 -70 C 118 -64, 135 -54, 142 -42" class="tree-branch thin"/>
      <path d="M 95 -70 C 108 -80, 118 -92, 120 -102" class="tree-branch thin"/>

      <path d="M -4 -120 C -32 -145, -70 -155, -105 -145" class="tree-branch"/>
      <path d="M -105 -145 C -128 -138, -145 -125, -150 -110" class="tree-branch thin"/>

      <path d="M 4 -125 C 32 -150, 70 -160, 105 -150" class="tree-branch"/>
      <path d="M 105 -150 C 128 -143, 145 -130, 150 -115" class="tree-branch thin"/>

