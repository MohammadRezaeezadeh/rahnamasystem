  <text x="400" y="155" text-anchor="middle" class="sea-label">دریای خزر</text>

  <!-- خلیج فارس (انحنی در جنوب - به سمت بالا) -->
  <path d="
    M 370 748
    C 410 762, 455 770, 500 772
    C 525 775, 540 765, 535 752
    C 490 745, 440 735, 395 725
    C 378 722, 368 728, 370 748 Z
