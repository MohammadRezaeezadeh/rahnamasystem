<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" fill="none" stroke="none">
  <defs>
    <radialGradient id="khorasanGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ef4444" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0.9"/>
    </radialGradient>

    <linearGradient id="iranFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(148, 163, 184, 0.08)"/>
      <stop offset="100%" stop-color="rgba(148, 163, 184, 0.04)"/>
    </linearGradient>

    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0f08"/>
      <stop offset="50%" stop-color="#5d3a20"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>

    <radialGradient id="leafGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bef264" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#84cc16" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#365314" stop-opacity="0.4"/>
    </radialGradient>

    <filter id="redGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="leafGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0" dy="1.5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="rgba(148, 163, 184, 0.12)"/>
    </pattern>
  </defs>

  <style>
    .iran-outline {
      fill: url(#iranFill);
      stroke: rgba(203, 213, 225, 0.65);
      stroke-width: 1.6;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .province-line {
      fill: none;
      stroke: rgba(148, 163, 184, 0.16);
      stroke-width: 0.6;
      stroke-dasharray: 3 4;
    }
    .khorasan-region {
      fill: url(#khorasanGlow);
      stroke: rgba(251, 191, 36, 0.6);
      stroke-width: 1;
      filter: url(#redGlow);
    }
    .tree-trunk { fill: url(#trunkGrad); }
    .tree-branch { stroke: #3d2415; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    .tree-branch.thin { stroke-width: 1.4; }
    .leaf { fill: url(#leafGrad); filter: url(#leafGlow); }
    .number { fill: rgba(255, 255, 255, 0.95); font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; }
    .number-small { fill: rgba(255, 255, 255, 0.75); font-family: 'JetBrains Mono', monospace; font-size: 8px; font-weight: 500; }
    .number-tiny { fill: rgba(255, 255, 255, 0.55); font-family: 'JetBrains Mono', monospace; font-size: 6.5px; }
    .sea-label { fill: rgba(56, 189, 248, 0.55); font-family: 'Vazirmatn', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1px; }
    .city-dot { fill: #fbbf24; }
    .city-dot.major { fill: #f59e0b; }
    .city-label { fill: rgba(251, 191, 36, 0.95); font-family: 'Vazirmatn', sans-serif; font-size: 9.5px; font-weight: 600; }
    .city-label.gray { fill: rgba(148, 163, 184, 0.75); font-weight: 500; }
  </style>

  <rect width="1000" height="800" fill="url(#dotPattern)" opacity="0.5"/>

  <!-- ================ نقشه ایران (بر اساس مختصات جغرافیایی واقعی) ================ -->
  <!-- مسیر مرز ایران از شمال غرب، در جهت عقربه‌های ساعت -->
  <path class="iran-outline" d="
    M 121 78
    L 167 101
    L 220 110
    L 280 118
    L 306 125
    L 311 125
    C 320 140, 328 155, 332 167
    C 350 180, 365 185, 374 190
    C 410 195, 450 200, 479 199
    C 500 200, 515 202, 521 204
    L 563 190
    L 626 195
    L 689 199
    L 750 207
    L 795 215
    L 820 230
    C 840 250, 855 280, 860 315
    C 865 360, 868 410, 865 455
    C 860 500, 850 545, 835 585
    C 815 625, 790 660, 758 690
    C 720 720, 678 742, 635 758
    C 590 770, 545 775, 500 772
    C 455 770, 410 762, 370 748
    C 330 732, 295 712, 268 688
    C 242 660, 222 628, 208 595
    C 192 555, 178 512, 168 468
    C 158 422, 150 375, 144 328
    C 138 282, 134 235, 132 190
    C 130 152, 128 120, 121 78 Z
  "/>

  <!-- دریای خزر (انحنی در شمال - به سمت پایین) -->
  <path d="
    M 220 110
    L 280 118
    L 306 125
    L 311 125
    C 320 140, 328 155, 332 167
    C 350 180, 365 185, 374 190
    C 410 195, 450 200, 479 199
    C 500 200, 515 202, 521 204
