      <path d="M -6 -55 C -32 -72, -65 -78, -95 -68" class="tree-branch"/>
      <path d="M -95 -68 C -118 -62, -135 -52, -142 -40" class="tree-branch thin"/>
      <path d="M -95 -68 C -108 -78, -118 -90, -120 -100" class="tree-branch thin"/>

