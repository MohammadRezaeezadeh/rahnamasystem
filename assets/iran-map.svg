  <text x="460" y="755" text-anchor="middle" class="sea-label">خلیج فارس</text>

  <!-- دریای عمان (جنوب شرق) -->
  <text x="810" y="620" text-anchor="middle" class="sea-label" transform="rotate(45 810 620)">دریای عمان</text>

  <!-- ================ خطوط استان‌ها (ساده‌شده) ================ -->
  <g class="province-line">
    <!-- شمال -->
    <path d="M 340 200 C 360 230, 375 260, 385 290"/>
    <path d="M 395 220 C 415 250, 428 280, 435 310"/>
    <path d="M 460 220 C 480 250, 495 280, 505 310"/>
    <path d="M 530 215 C 548 245, 560 275, 570 305"/>
