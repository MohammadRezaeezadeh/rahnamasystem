  <!-- ================ خراسان بزرگ (یکپارچه در شمال شرق) ================ -->
  <g class="khorasan-group">
    <path class="khorasan-region" d="
      M 620 195
      C 660 188, 700 188, 735 192
      C 770 196, 800 205, 825 220
      C 845 235, 858 258, 862 285
      C 866 320, 868 360, 865 400
      C 862 440, 855 478, 842 510
      C 825 540, 800 560, 770 570
