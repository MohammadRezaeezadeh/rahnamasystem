  <!-- برچسب خراسان بزرگ -->
  <g class="khorasan-label">
    <rect x="645" y="640" width="150" height="50" rx="12" fill="rgba(15, 21, 37, 0.9)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1"/>
    <text x="720" y="662" text-anchor="middle" fill="white" font-family="Vazirmatn" font-size="15" font-weight="800" letter-spacing="1.5">خراسان بزرگ</text>
    <text x="720" y="680" text-anchor="middle" fill="rgba(254, 226, 226, 0.85)" font-family="Vazirmatn" font-size="9" font-weight="500">زادگاه سپیدار سیستم</text>
